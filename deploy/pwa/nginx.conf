map $http_x_forwarded_proto $unio_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    error_log /dev/stderr crit;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    # Revalidate unversioned Flutter assets on each online navigation.
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    client_max_body_size 22m;
    location /api/ {
        proxy_pass ${UNIO_API_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $unio_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ (^|/)\. { deny all; }
    location ~ \.map$ { deny all; }
}
