<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="UNIO — расписание ВГСПУ, новости, поиск преподавателей и личные заметки.">
  <meta name="theme-color" content="#0B0D18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UNIO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="pwa.css">
  <title>UNIO · Веб-бета</title>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="" width="80" height="80">
    <strong>UNIO</strong><span id="boot-message">Твой университет рядом</span>
    <button id="retry" hidden>Попробовать снова</button>
  </div>
  <aside id="update" hidden aria-live="polite">
    <span>Доступна новая версия UNIO. Сохраните заметку перед обновлением.</span>
    <button id="update-now">Обновить</button><button id="update-later">Позже</button>
  </aside>
  <noscript>Для UNIO нужен включённый JavaScript.</noscript>
  <script src="pwa.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
